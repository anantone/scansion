AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

# Choix documentés pour ce codebase (prosodie française, moteur de règles) :
Style/FormatStringToken:
  EnforcedStyle: template # format('%3d  %s', ...) positionnels au CLI

Naming/AsciiIdentifiers:
  Enabled: false # « h aspiré » : H_ASPIRÉ, h_aspiré? (terme technique français)

Naming/MethodParameterName:
  AllowedNames: ['a', 'ch', 'i', 'n', 'on'] # index / lettre / nombre / drapeau : params courts idiomatiques

Style/OptionalBooleanParameter:
  Enabled: false # API volontaire : dierese: false/true/:auto, drapeau interne big:

# Le moteur de règles est découpé en une méthode par règle (Aligner#vowel_*,
# #consonant_*, Accents.frontiere_*) : les plafonds par méthode sont serrés
# et servent de fil d'alarme ; les plafonds de module/classe reflètent le
# nombre de règles (une règle = une méthode commentée).
Metrics/BlockLength:
  Exclude: ['spec/**/*']
  Max: 30
Metrics/MethodLength:
  Max: 45
Metrics/AbcSize:
  Max: 95
Metrics/CyclomaticComplexity:
  Max: 25
Metrics/PerceivedComplexity:
  Max: 25
Metrics/ParameterLists:
  Max: 12
Metrics/ClassLength:
  Max: 575
Metrics/ModuleLength:
  Max: 1020
